<body>

  <!-- Top Navigation Bar -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn sidebar-toggle-btn" id="sidebarToggleBtn" aria-label="បិទ/បើកផ្ទាំងមាតិកា" title="បិទ/បើកផ្ទាំងមាតិកា (Collapse / Expand Sidebar)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
      </button>

      <a href="#home" class="brand-link">
        <img
          src="images/logo.webp"
          alt="RPITSSR Logo" class="brand-logo">
        <div class="brand-text-container">
          <span class="brand-title">គណិតវិទ្យាសម្រាប់កុំព្យូទ័រ</span>
          <span class="brand-subtitle">Mathematics for Computing | RPITSSR</span>
        </div>
      </a>
    </div>

    <div class="topbar-center">
      <button class="search-trigger-btn" id="searchTriggerBtn">
        <div class="search-trigger-content">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <span>ស្វែងរកមេរៀន, រូបមន្ត, ទ្រឹស្តីបទ...</span>
        </div>
        <div class="kbd-shortcut">
          <kbd class="kbd-badge" id="searchShortcutModKey">Ctrl</kbd>
          <kbd class="kbd-badge">K</kbd>
        </div>
      </button>
    </div>

    <div class="topbar-right">
      <div class="font-size-controls" title="កែសម្រួលទំហំអក្សរ (Font Size)">
        <button class="font-btn" id="btnFontDec" aria-label="បន្ថយទំហំអក្សរ" title="បន្ថយទំហំអក្សរ (A-)">A-</button>
        <button class="font-btn active" id="btnFontReset" aria-label="ទំហំអក្សរដើម"
          title="ទំហំអក្សរដើម (100%)">A</button>
        <button class="font-btn" id="btnFontInc" aria-label="ពង្រីកទំហំអក្សរ" title="ពង្រីកទំហំអក្សរ (A+)">A+</button>
      </div>

      <div class="progress-pill" title="វឌ្ឍនភាពនៃការរៀនសូត្រ">
        <span>វឌ្ឍនភាព៖</span>
        <div class="progress-bar-mini">
          <div class="progress-bar-fill" id="progressFill" style="width: 0%;"></div>
        </div>
        <span id="progressText" style="font-family:var(--font-mono);">0/30 (0%)</span>
      </div>

      <button class="icon-btn mobile-search-btn" id="mobileSearchBtn" aria-label="ស្វែងរក" title="ស្វែងរក">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>

      <button class="icon-btn" id="themeToggleBtn" aria-label="ប្តូរពន្លឺ / ងងឹត" title="ប្តូរ Dark/Light Mode">
        <span id="themeIcon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </span>
      </button>
    </div>

  <div class="app-container">

      <!-- Populated dynamically by app.js -->

    <!-- Main Content Canvas -->
    <main class="main-content" id="mainContent">
      <!-- Populated dynamically by app.js -->
    </main>
  </div>

  <!-- Floating Sidebar Expand Pill for Desktop when Minimized -->

    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
      <line x1="9" y1="3" x2="9" y2="21"></line>
      <polyline points="14 9 17 12 14 15"></polyline>
    </svg>
    <span>មាតិកា</span>
  </button>

  <!-- Mobile Bottom Quick Navigation Bar -->
  <nav class="mobile-bottom-bar" id="mobileBottomBar" aria-label="ការបញ្ជាលើទូរស័ព្ទ">

        <line x1="3" y1="18" x2="21" y2="18"></line>

    <button class="mobile-bar-btn" id="mbarSearchBtn" title="ស្វែងរកមេរៀន">

      </svg>
      <span>ស្វែងរក</span>
    </button>

    <button class="mobile-bar-btn" id="mbarNextBtn" title="មេរៀនបន្ទាប់">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
      <span>បន្ទាប់</span>
    </button>

    <button class="mobile-bar-btn" id="mbarTopBtn" title="ឡើងលើ">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
      <span>ឡើងលើ</span>
    </button>
  </nav>

  <!-- Live Search Modal Backdrop -->
  <div class="search-modal-backdrop" id="searchModal">
    <div class="search-modal-card">
      <div class="search-input-header">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          style="color:var(--text-muted);">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" class="search-main-input" id="searchInput" placeholder="វាយពាក្យគន្លឹះដើម្បីស្វែងរក..."
          autocomplete="off">
        <button class="icon-btn" id="closeSearchBtn" style="border:none; width:30px; height:30px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <ul class="search-results-list" id="searchResults">
        <!-- Results dynamically populated -->
      </ul>
      <div class="search-footer">
        <span>ចុច <kbd class="kbd-badge">ESC</kbd> ដើម្បីបិទ</span>
        <span>ស្វែងរកមេរៀនទាំង ៦ និងអត្រាកំណែលំហាត់</span>
      </div>
    </div>
  </div>

  <!-- Lightbox Modal -->
  <div class="lightbox-modal" id="lightboxModal">
    <div class="lightbox-content-box">
      <button class="lightbox-close-btn" id="closeLightboxBtn" aria-label="បិទ">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"></line>

      <div class="lightbox-caption" id="lightboxCaption"></div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Application Data & Logic -->
  <script src="js/course-data.js"></script>
